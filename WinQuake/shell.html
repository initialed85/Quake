<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <title>Quake</title>
    <script language="javascript">
      const onLoadOrResize = () => {
        const canvas = document.getElementById("canvas");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };

      const onLoad = () => {
        onLoadOrResize();
      };

      const onResize = () => {
        onLoadOrResize();
      };
    </script>
  </head>
  <body onload="javascript: onLoad();" onresize="javascript: onResize();" style="padding: 0px; margin: 0px">
    <div class="emscripten_border" style="padding: 0px; margin: 0px">
      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
        style="margin: 0px; padding: 0px"
      ></canvas>
    </div>
    <script>
      const canvasElement = document.getElementById("canvas");

      canvasElement.addEventListener("webglcontextlost", (e) => {
        (alert("WebGL context lost. You will need to reload the page."), e.preventDefault());
      });

      //
      // work out which resolution to ask for
      //

      const desiredAspectRatio = 320.0 / 200.0;

      const windowW = window.innerWidth; // e.g. 640
      const windowH = window.innerHeight; // e.g. 400

      const heightFromWidth = windowW / desiredAspectRatio; // e.g. 640 / 1.6 = 400
      const widthFromHeight = windowH * desiredAspectRatio; // e.g. 400 * 1.6 = 640

      let width, height;

      if (heightFromWidth < windowH) {
        width = windowW;
        height = heightFromWidth;
      } else {
        width = widthFromHeight;
        height = windowH;
      }

      width = Math.round(width);
      height = Math.round(height);

      //
      // work out the WebSocket URL (should be the immediate parent of this URL + /ws)
      //

      let urlParts = window.location.href.split("/");
      urlParts.pop();
      if (urlParts[urlParts.length - 1].trim() == "") {
        urlParts.pop();
      }
      urlParts.push("ws");
      const webSocketUrl = urlParts.join("/");
      console.log(`webSocketUrl: ${webSocketUrl}`);

      //
      // set / recall the clientId (fake IP address)
      //

      let clientId = sessionStorage.getItem("clientId");

      while (
        !clientId ||
        typeof clientId !== "string" ||
        clientId.split(".").length !== 4 ||
        clientId === "255.255.255.255" ||
        clientId.split(".")[0] === "0" ||
        clientId.split(".")[0] === "255"
      ) {
        clientId = crypto.getRandomValues(new Uint8Array(4)).join(".");
      }

      sessionStorage.setItem("clientId", clientId);

      console.log(`set clientId: ${clientId} in sessionStorage`);

      //
      // set / recall the player colours
      //

      let color = sessionStorage.getItem("color");

      if (!color || typeof color !== "string" || color.split(" ").length !== 2) {
        while (!color) {
          color = `${Math.floor(Math.random() * 16)} ${Math.floor(Math.random() * 16)}`;
        }

        sessionStorage.setItem("color", color);

        console.log(`set color: ${color} in sessionStorage`);
      } else {
        console.log(`remembered color: ${color} from sessionStorage`);
      }

      //
      // build up the commandline arguments
      //

      let arguments = [];

      URL.parse(window.location.href.replaceAll("+", "%2b"))?.searchParams?.forEach((v, k) => {
        arguments.push(...k.split(" "));
        arguments.push(...v.split(" "));
      });

      arguments = arguments.filter((x) => x.trim().length);

      console.log(`arguments (before): ${JSON.stringify(arguments)}`);

      if (!arguments.includes("-width")) {
        arguments.push("-width", width);
      }

      if (!arguments.includes("-height")) {
        arguments.push("-height", height);
      }

      const widthArg = arguments.indexOf("-width");
      const heightArg = arguments.indexOf("-height");
      const requestedWidth = Number(arguments[widthArg + 1]);
      const requestedHeight = Number(arguments[heightArg + 1]);
      const quakeWidth = Number.isFinite(requestedWidth) && requestedWidth > 0 ? requestedWidth : width;
      const quakeHeight = Number.isFinite(requestedHeight) && requestedHeight > 0 ? requestedHeight : height;
      const currentAspectRatio = quakeWidth / quakeHeight;

      // Pointer-lock movement is reported in display-relative units. Convert it
      // to equivalent movement in the effective Quake render dimensions so
      // browser sensitivity does not depend on the desktop resolution.
      const devicePixelRatio = Number(window.devicePixelRatio) || 1;
      const desktopWidth = window.screen?.width ? window.screen.width * devicePixelRatio : quakeWidth;
      const desktopHeight = window.screen?.height ? window.screen.height * devicePixelRatio : quakeHeight;
      const mouseScaleX = quakeWidth / desktopWidth;
      const mouseScaleY = quakeHeight / desktopHeight;

      console.log(
        `width: ${quakeWidth}, height: ${quakeHeight}, desiredAspectRatio: ${desiredAspectRatio}, currentAspectRatio: ${currentAspectRatio}, devicePixelRatio: ${devicePixelRatio}, mouseScaleX: ${mouseScaleX}, mouseScaleY: ${mouseScaleY}`,
      );

      if (!arguments.includes("-mouse_scale_x")) {
        arguments.push("-mouse_scale_x", mouseScaleX);
      }

      if (!arguments.includes("-mouse_scale_y")) {
        arguments.push("-mouse_scale_y", mouseScaleY);
      }

      arguments = arguments.filter((x) => x !== "websocketurl");
      arguments.push("-websocketurl", webSocketUrl);

      arguments = arguments.filter((x) => x !== "clientid");
      arguments.push("-clientid", clientId);

      if (!arguments.includes("+hostname")) {
        arguments.push("+hostname", "ws" + clientId.replaceAll(".", ""));
      }

      if (!arguments.includes("+name")) {
        arguments.push("+name", "ws" + clientId.replaceAll(".", ""));
      }

      arguments = arguments.filter((x) => x !== "color");
      arguments.push("+color", color);

      arguments = arguments.map((x) => x.toString());

      console.log(`arguments (after): ${JSON.stringify(arguments)}`);

        const onMessage = (e) => {
            if (e.data === 'quake_connected' || e.data?.type === 'quake_connected') {
                console.log("received 'quake_connected' event");
            }
        };
        window.addEventListener('message', onMessage);

        var Module = {
        print(...e) {
          console.log(...e);
        },
        printErr(...e) {
          console.warn(...e);
        },
        canvas: canvasElement,
        arguments: arguments,
      };
    </script>

    {{{ SCRIPT }}}
  </body>
</html>
